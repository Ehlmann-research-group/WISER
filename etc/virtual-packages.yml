# Virtual packages conda-lock solves against. This file replaces conda-lock's defaults, so
# every locked platform is listed; all values except __osx are conda-lock's defaults.
# __osx is the oldest macOS the locked packages may require and must match
# MACOSX_DEPLOYMENT_TARGET in the top-level Makefile.
subdirs:
  linux-64:
    packages:
      __unix: "0"
      __linux: "5.10"
      __archspec: "1 x86_64"
      __glibc: "2.28"
      __cuda: "11.4"
  linux-aarch64:
    packages:
      __unix: "0"
      __linux: "5.10"
      __archspec: "1 aarch64"
      __glibc: "2.28"
      __cuda: "11.4"
  osx-64:
    packages:
      __unix: "0"
      __archspec: "1 x86_64"
      __osx: "14.0"
  osx-arm64:
    packages:
      __unix: "0"
      __archspec: "1 arm64"
      __osx: "14.0"
  win-64:
    packages:
      __win: "0"
      __archspec: "1 x86_64"
      __cuda: "11.4"
