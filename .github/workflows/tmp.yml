  linux:
    name: Linux (Docker) build + smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux targets
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_linux_targets.sh
          ./build_linux_targets.sh

      # Run the Phase C images so ENTRYPOINT smoke tests actually execute
      - name: Smoke test (run Phase C containers)
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm wiser-phasec:ubuntu20.04
          docker run --rm wiser-phasec:debian11
          docker run --rm wiser-phasec:fedora39

      # Rename into the exact filenames you want
      - name: Collect and rename tarballs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/linux

          # Adjust these paths to match whatever your script outputs
          cp linux_build_output/*ubuntu_2004_amd*/*WISER*.tar.gz dist/linux/WISER-ubuntu_2004-amd64.tar.gz
          cp linux_build_output/*debian_11_amd*/*WISER*.tar.gz dist/linux/WISER-debian_11-amd64.tar.gz
          cp linux_build_output/*fedora_39_amd*/*WISER*.tar.gz dist/linux/WISER-fedora_39-amd64.tar.gz
          cp linux_build_output/*ubuntu_2004_arm*/*WISER*.tar.gz dist/linux/WISER-ubuntu_2004-arm64.tar.gz
          cp linux_build_output/*debian_11_arm*/*WISER*.tar.gz dist/linux/WISER-debian_11-arm64.tar.gz
          cp linux_build_output/*fedora_39_arm*/*WISER*.tar.gz dist/linux/WISER-fedora_39-arm64.tar.gz

          sha256sum dist/linux/*.tar.gz > dist/linux/SHA256SUMS.txt
          ls -lah dist/linux

      - name: Upload Linux artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: wiser-linux-amd64
          path: dist/linux/**
          if-no-files-found: error

      - name: Upload Linux assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS.txt
